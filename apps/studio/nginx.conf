server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The shell must not be cached, or a deploy keeps serving the old asset
    # references until the browser gives up on its copy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Routing is client-side: /preview and /editor are not files on disk, so
    # every unknown path has to fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
