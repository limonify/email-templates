name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Verify & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Check code formatting
        run: bun run format:check

      - name: Typecheck package
        run: bun run --filter @limonify/email-templates typecheck

      - name: Run package test suite
        working-directory: packages/email-templates
        run: bun test

      - name: Verify browser-safe entry has no node dependencies
        run: bun run --filter @limonify/email-templates check:web

      - name: Typecheck studio app
        run: bun run --filter @limonify/studio typecheck

      - name: Build studio app
        run: bun run --filter @limonify/studio build
