name: Release & Publish

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node for NPM Publish
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Sync package.json version from Release Tag
        working-directory: packages/email-templates
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -n "$VERSION" ] && [ "$VERSION" != "main" ]; then
            echo "Setting package.json version to $VERSION"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run verification checks
        run: |
          bun run --filter @limonify/email-templates typecheck
          bun run format:check
          bun run --filter @limonify/email-templates test

      - name: Build standalone bundle
        working-directory: packages/email-templates
        run: bun run build

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/email-templates
        run: npm publish --access public
